<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HourLoom — a time bank on BOT Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.9.0/ethers.umd.min.js"></script>
<style>
/* ============================================================================
   CLAYMORPHISM — pillowy inflatable shapes, double inner shadows, big radii,
   pastel tones. Laid out as a single app column with a fixed bottom tab bar,
   so nothing here is a desktop dashboard.
   ========================================================================== */
:root{
  --bg:#edeaf9;
  --clay:#ffffff;
  --clay-2:#f3f0ff;
  --ink:#473f6b;
  --ink-soft:#8d86ad;
  --mint:#8fe3bf;
  --peach:#ffbfa3;
  --lilac:#c3b4fb;
  --sky:#a3d4ff;
  --rose:#ff9db4;
  --shadow-dark:rgba(103,92,160,.42);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.6;
  background-image:
    radial-gradient(circle at 16% 8%, rgba(163,212,255,.55), transparent 42%),
    radial-gradient(circle at 86% 18%, rgba(255,191,163,.45), transparent 40%),
    radial-gradient(circle at 60% 92%, rgba(143,227,191,.45), transparent 44%);
  background-attachment:fixed;
  padding-bottom:104px;
}
h1,h2,h3,h4,.baloo{font-family:'Baloo 2',cursive;font-weight:700;margin:0;line-height:1.2}

.app{max-width:520px;margin:0 auto;padding:22px 18px 10px}

/* ---------- the clay surface ---------- */
.clay{
  background:var(--clay);border-radius:30px;padding:22px;
  box-shadow:
    inset -7px -7px 14px rgba(255,255,255,.95),
    inset 7px 7px 16px rgba(174,164,214,.4),
    0 14px 26px var(--shadow-dark);
}
.clay.tint{background:var(--clay-2)}
.clay.sm{border-radius:24px;padding:16px 18px}

/* ---------- header ---------- */
.apphead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.blob{width:54px;height:54px;border-radius:22px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--lilac),var(--sky));
  box-shadow:inset -4px -4px 9px rgba(255,255,255,.75), inset 4px 4px 9px rgba(120,106,178,.4),
             0 9px 18px var(--shadow-dark);
  display:grid;place-items:center;font-family:'Baloo 2';font-size:22px;color:#fff}
.apphead h1{font-size:27px}
.apphead p{margin:0;font-size:13px;color:var(--ink-soft);font-weight:600}

/* ---------- pills + buttons ---------- */
button{
  font-family:'Baloo 2',cursive;font-weight:600;font-size:15px;cursor:pointer;border:none;
  color:#3c3560;padding:11px 20px;border-radius:999px;background:linear-gradient(145deg,#ffffff,#e7e2fb);
  box-shadow:inset -3px -3px 7px rgba(255,255,255,.9), inset 3px 3px 7px rgba(160,150,205,.45),
             0 8px 16px rgba(103,92,160,.3);
  transition:.14s
}
button:hover:not(:disabled){transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(1px);
  box-shadow:inset 4px 4px 9px rgba(160,150,205,.55), inset -3px -3px 7px rgba(255,255,255,.8)}
button:disabled{opacity:.45;cursor:not-allowed}
button.mint{background:linear-gradient(145deg,#b3f0d4,var(--mint));color:#17543c}
button.peach{background:linear-gradient(145deg,#ffd6c2,var(--peach));color:#7a3a1c}
button.lilac{background:linear-gradient(145deg,#d9cfff,var(--lilac));color:#3b2d7a}
button.sm{font-size:13.5px;padding:8px 15px}

.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-family:'Baloo 2';font-weight:600;font-size:12px;padding:6px 13px;border-radius:999px;
  background:var(--clay);color:var(--ink-soft);
  box-shadow:inset -2px -2px 5px rgba(255,255,255,.9), inset 2px 2px 5px rgba(160,150,205,.35)}
.pill.ok{background:linear-gradient(145deg,#b3f0d4,var(--mint));color:#17543c}
.pill.warn{background:linear-gradient(145deg,#ffd6c2,var(--peach));color:#7a3a1c}

/* ---------- balance bubble ---------- */
.balance{text-align:center;padding:26px 22px}
.balance .num{font-family:'Baloo 2';font-size:58px;line-height:1;margin:6px 0}
.balance .num.plus{color:#2f9c72}
.balance .num.minus{color:#d2607f}
.balance .cap{font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.gauge{height:20px;border-radius:999px;background:var(--clay-2);margin-top:18px;position:relative;
  box-shadow:inset 3px 3px 7px rgba(160,150,205,.45), inset -3px -3px 7px rgba(255,255,255,.9)}
.gauge i{position:absolute;top:3px;bottom:3px;border-radius:999px;
  background:linear-gradient(145deg,#b3f0d4,var(--mint));box-shadow:0 2px 6px rgba(47,156,114,.35)}
.gauge i.owe{background:linear-gradient(145deg,#ffc2d2,var(--rose))}
.gauge .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;border-radius:2px;
  background:rgba(141,134,173,.5)}

/* ---------- entry bubbles ---------- */
.list{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.entry{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center}
.chip{width:58px;height:58px;border-radius:21px;display:grid;place-items:center;
  font-family:'Baloo 2';font-size:17px;color:#fff;
  box-shadow:inset -3px -3px 8px rgba(255,255,255,.55), inset 3px 3px 8px rgba(0,0,0,.14),
             0 7px 14px var(--shadow-dark)}
.chip.pending{background:linear-gradient(145deg,#ffd6c2,var(--peach));color:#7a3a1c}
.chip.confirmed{background:linear-gradient(145deg,#b3f0d4,var(--mint));color:#17543c}
.chip.declined{background:linear-gradient(145deg,#e4e0f3,#c8c2e0);color:#5b5480}
.chip.cancelled{background:linear-gradient(145deg,#d9cfff,var(--lilac));color:#3b2d7a}
.chip.ask{background:linear-gradient(145deg,#c9e6ff,var(--sky));color:#19456e}
.entry h4{font-size:17px}
.entry .meta{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.entry .acts{grid-column:1/-1;display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}

label{display:block;font-family:'Baloo 2';font-weight:600;font-size:13px;color:var(--ink-soft);
  margin:16px 0 7px}
input,select{width:100%;padding:13px 17px;border:none;border-radius:999px;background:var(--clay-2);
  color:var(--ink);font-family:'Nunito';font-weight:600;font-size:15px;
  box-shadow:inset 4px 4px 9px rgba(160,150,205,.4), inset -4px -4px 9px rgba(255,255,255,.95)}
input:focus,select:focus{outline:3px solid rgba(195,180,251,.6);outline-offset:1px}

.section-title{font-family:'Baloo 2';font-weight:700;font-size:21px;margin:24px 2px 10px}
.blurb{font-size:14px;color:var(--ink-soft);font-weight:600;margin:0 0 4px}
.empty{text-align:center;color:var(--ink-soft);font-weight:600;padding:30px 10px}

/* ---------- fixed bottom tab bar ---------- */
.tabs{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;
  display:flex;gap:6px;padding:9px;border-radius:999px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  box-shadow:inset -3px -3px 8px rgba(255,255,255,.95), inset 3px 3px 9px rgba(160,150,205,.4),
             0 14px 28px var(--shadow-dark);
  width:min(480px,calc(100vw - 32px));
}
.tabs button{flex:1;font-size:13.5px;padding:11px 6px;background:transparent;box-shadow:none;color:var(--ink-soft)}
.tabs button.on{background:linear-gradient(145deg,#d9cfff,var(--lilac));color:#3b2d7a;
  box-shadow:inset -3px -3px 7px rgba(255,255,255,.75), inset 3px 3px 7px rgba(120,106,178,.35)}
.tabs button:hover:not(.on){transform:none;color:var(--ink)}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(200%);
  background:linear-gradient(145deg,#ffffff,#e7e2fb);color:var(--ink);padding:13px 22px;border-radius:999px;
  font-family:'Baloo 2';font-weight:600;font-size:14.5px;max-width:88vw;z-index:60;transition:transform .24s;
  box-shadow:0 14px 28px var(--shadow-dark), inset -3px -3px 7px rgba(255,255,255,.9)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{background:linear-gradient(145deg,#ffd0dc,var(--rose));color:#6d1f33}

/* ===== BOT Chain ecosystem footer (KPI 5) ===== */
footer.bc-foot{display:block;max-width:520px;margin:22px auto 0;padding:0 18px}
.bc-foot-grid{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;
  background:#fff;border-radius:30px;padding:20px 22px;
  box-shadow:inset -7px -7px 14px rgba(255,255,255,.95), inset 7px 7px 16px rgba(174,164,214,.4),
             0 14px 26px rgba(103,92,160,.42)}
.bc-foot .bc-logo{width:54px;height:54px;border-radius:21px;display:grid;place-items:center;
  background:linear-gradient(145deg,#d9cfff,#c3b4fb);
  box-shadow:inset -4px -4px 9px rgba(255,255,255,.75), inset 4px 4px 9px rgba(120,106,178,.4)}
.bc-foot .bc-id{font-family:'Baloo 2',cursive;font-weight:700;font-size:21px;color:#473f6b}
.bc-foot .bc-id small{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:#8d86ad;margin-top:1px}
.bc-foot .bc-links{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.bc-foot .bc-links a{flex:1;text-align:center;font-family:'Baloo 2',cursive;font-weight:600;
  font-size:14px;color:#3c3560;text-decoration:none;padding:11px 18px;border-radius:999px;
  background:linear-gradient(145deg,#ffffff,#e7e2fb);
  box-shadow:inset -3px -3px 7px rgba(255,255,255,.9), inset 3px 3px 7px rgba(160,150,205,.45),
             0 8px 16px rgba(103,92,160,.3)}
.bc-foot .bc-links a:nth-child(2){background:linear-gradient(145deg,#b3f0d4,#8fe3bf);color:#17543c}
.bc-foot .bc-links a:hover{transform:translateY(-2px)}
.bc-foot .bc-meta{font-family:'Nunito',sans-serif;font-weight:600;font-size:11.5px;
  color:#8d86ad;padding:14px 8px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bc-foot .bc-meta b{color:#473f6b;font-weight:700}
</style>
</head>
<body>

<div class="app">
  <div class="apphead">
    <div class="blob">⧗</div>
    <div>
      <h1>HourLoom</h1>
      <p>a time bank — the unit is an hour of someone's work</p>
    </div>
  </div>

  <div class="pillrow">
    <span class="pill" id="p-net">network</span>
    <span class="pill" id="p-ctr">contract</span>
    <span class="pill" id="p-acct">not connected</span>
  </div>

  <div id="view"></div>
</div>

<nav class="tabs">
  <button class="on" data-tab="inbox">Inbox</button>
  <button data-tab="ledger">Loom</button>
  <button data-tab="board">Asks</button>
  <button data-tab="give">Give</button>
  <button data-tab="me">Me</button>
</nav>


<!-- ===== BOT Chain ecosystem footer (KPI 5) ===== -->
<footer class="bc-foot">
  <div class="bc-foot-grid">
    <div class="bc-logo" aria-hidden="true"><svg viewBox="0 0 63.63 100" xmlns="http://www.w3.org/2000/svg" style="width:22px;height:35px;display:block"><path fill="#00A67E" d="M31.67 99.95 L0 82.48 L0.11 63.74 L47.01 90.60 L47.01 73.19 L15.98 55.32 L15.95 36.49 L46.92 53.57 L47.39 36.82 L15.96 17.81 L16.26 0 L63.06 27.02 L62.82 46.20 L47.86 54.67 L62.85 63.00 L63.62 81.42 Z"/></svg></div>
    <div class="bc-id">BOT Chain<small>Part of the ecosystem</small></div>
    <div class="bc-links">
      <a href="https://botchain.ai" target="_blank" rel="noopener noreferrer">botchain.ai</a>
      <a id="bc-explorer" href="https://scan.botchain.ai" target="_blank" rel="noopener noreferrer">Explorer</a>
    </div>
  </div>
  <div class="bc-meta">
    <span>&copy; 2026 <b>BOT Chain</b> &mdash; EVM-compatible Layer 1</span>
  </div>
</footer>

<div id="toast"></div>

<script>
/* ============================================================================
   CONTRACT + NETWORK CONFIG

   LIVE ON BOT CHAIN MAINNET (chain 677). Deployed 2026-10-28.

   To go back to testnet, move these five values together, never some of them:
     CONTRACT_ADDRESS  -> the testnet address
     chainId           -> "0x3C8"
     chainName         -> "BOT Chain Testnet"
     rpcUrls           -> ["https://rpc.bohr.life"]
     blockExplorerUrls -> ["https://scan.bohr.life"]
   ...and set label -> "TESTNET" so the badge reads correctly.

   Changing some but not others is what produced the FlowPay BAD_DATA bug.
   ========================================================================== */
const CONTRACT_ADDRESS = "0x2e14F1571A9a1f84E574f64aE5aD6b679bF426e8";

const NETWORK = {
  chainId: "0x2A5",                                // 677 mainnet | testnet: "0x3C8"
  chainIdDec: 677,                                 // reference only, not shown on the page | testnet: 968
  chainName: "BOT Chain",                          //             | testnet: "BOT Chain Testnet"
  rpcUrls: ["https://rpc.botchain.ai"],            //             | testnet: ["https://rpc.bohr.life"]
  blockExplorerUrls: ["https://scan.botchain.ai"], //             | testnet: ["https://scan.bohr.life"]
  nativeCurrency: { name: "BOT", symbol: "BOT", decimals: 18 },
  label: "MAINNET"                                 //             | testnet: "TESTNET"
};

const ABI = [
  "function join(string handle) payable",
  "function leave()",
  "function logHours(address to, uint32 minutesGiven, string memo) returns (uint256)",
  "function confirmEntry(uint256 entryId)",
  "function declineEntry(uint256 entryId)",
  "function cancelEntry(uint256 entryId)",
  "function postRequest(uint32 minutesWanted, string memo) returns (uint256)",
  "function closeRequest(uint256 requestId)",
  "function getMember(address who) view returns (tuple(bool active,uint64 joinedAt,int256 balanceMinutes,uint32 givenCount,uint32 receivedCount,uint256 bond,string handle))",
  "function balanceOf(address who) view returns (int256)",
  "function isMember(address who) view returns (bool)",
  "function entryCount() view returns (uint256)",
  "function getEntry(uint256 id) view returns (tuple(address from,address to,uint32 minutesGiven,uint8 status,uint64 createdAt,string memo))",
  "function entriesGivenBy(address who) view returns (uint256[])",
  "function entriesReceivedBy(address who) view returns (uint256[])",
  "function requestCount() view returns (uint256)",
  "function getRequest(uint256 id) view returns (tuple(address who,uint32 minutesWanted,bool open,uint64 createdAt,string memo))",
  "function getRecentEntries(uint256 limit) view returns (uint256[])",
  "function getRecentRequests(uint256 limit) view returns (uint256[])",
  "function headroomMinutes(address who) view returns (uint256)",
  "function memberCount() view returns (uint32)",
  "function joinBond() view returns (uint256)",
  "function joinFee() view returns (uint256)",
  "function debtFloorMinutes() view returns (int256)"
];

const ZERO = "0x0000000000000000000000000000000000000000";
const $ = (id) => document.getElementById(id);
let provider, signer, account, contract, readContract;
let me = null, entries = [], inbox = [], requests = [], floor = -1440n, stats = {}, tab = "inbox";

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = ""), 4400);
}
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
function hrs(mins) {
  const m = Math.abs(Number(mins));
  const h = Math.floor(m / 60), r = m % 60;
  const sign = Number(mins) < 0 ? "−" : "";
  if (h && r) return sign + h + "h " + r + "m";
  if (h) return sign + h + "h";
  return sign + r + "m";
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function reason(e) {
  const m = (e && (e.shortMessage || e.reason || e.message)) || "Transaction failed";
  return String(m).replace(/^execution reverted:?\s*/i, "").slice(0, 150);
}
const when = (ts) => new Date(Number(ts) * 1000).toISOString().slice(0, 10);

/* ---------------------------------------------------------------- wallet */
function readOnly() {
  try {
    const p = new ethers.JsonRpcProvider(NETWORK.rpcUrls[0]);
    readContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, p);
  } catch (e) { /* no read-only view */ }
}
async function connect() {
  if (!window.ethereum) { toast("No wallet found. Install MetaMask.", true); return; }
  try {
    walletBusy = true;
    setTimeout(function () { walletBusy = false; }, 8000);
    await window.ethereum.request({ method: "eth_requestAccounts" });
    await ensureChain();
    walletBusy = false;
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    $("p-acct").textContent = short(account);
    $("p-acct").className = "pill ok";
    await load();
  } catch (e) { toast(reason(e), true); }
}
async function ensureChain() {
  const current = await window.ethereum.request({ method: "eth_chainId" });
  if (current.toLowerCase() === NETWORK.chainId.toLowerCase()) return;
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: NETWORK.chainId }] });
  } catch (err) {
    if (err.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: NETWORK.chainId, chainName: NETWORK.chainName, rpcUrls: NETWORK.rpcUrls,
          blockExplorerUrls: NETWORK.blockExplorerUrls, nativeCurrency: NETWORK.nativeCurrency
        }]
      });
    } else throw err;
  }
}

/* ------------------------------------------------------------------ load */
async function load() {
  const c = contract || readContract;
  if (!c || CONTRACT_ADDRESS === ZERO) { render(); return; }
  try {
    const [members, ec, rc, fl] = await Promise.all([
      c.memberCount(), c.entryCount(), c.requestCount(), c.debtFloorMinutes()
    ]);
    floor = fl;
    stats = { members: Number(members), entries: Number(ec), requests: Number(rc) };

    const reqIds = await c.getRecentRequests(20n);
    requests = [];
    for (const id of reqIds) requests.push({ id, r: await c.getRequest(id) });

    const entIds = await c.getRecentEntries(20n);
    entries = [];
    for (const id of entIds) entries.push({ id, e: await c.getEntry(id) });

    if (account) {
      me = await c.getMember(account);
      const mineIn = await c.entriesReceivedBy(account);
      inbox = [];
      for (const id of mineIn) {
        const e = await c.getEntry(id);
        if (Number(e.status) === 0) inbox.push({ id, e });
      }
    } else { me = null; inbox = []; }
    render();
  } catch (e) {
    toast("Could not read the contract. Check the address and network.", true);
  }
}

/* ---------------------------------------------------------------- render */
const STATUS = ["Pending", "Confirmed", "Declined", "Cancelled"];

function render() {
  const v = $("view");
  if (CONTRACT_ADDRESS === ZERO) {
    v.innerHTML = '<div class="clay"><h2>No contract yet</h2><p class="blurb">Deploy HourLoom, then paste the address into <b>CONTRACT_ADDRESS</b> in this file.</p></div>';
    return;
  }
  if (tab === "me") return renderMe(v);
  if (tab === "give") return renderGive(v);
  if (tab === "board") return renderBoard(v);
  return renderEntries(v, tab === "inbox" ? inbox : entries, tab === "inbox");
}

async function renderMe(v) {
  if (!account) {
    v.innerHTML = '<div class="clay balance"><div class="cap">not connected</div>' +
      '<h2 style="margin:12px 0 14px">Join the loom</h2>' +
      '<button class="lilac" id="do-connect">Connect wallet</button></div>';
    $("do-connect").onclick = connect;
    return;
  }
  if (!me || !me.active) {
    const c = contract || readContract;
    let cost = "";
    try {
      const [b, f] = await Promise.all([c.joinBond(), c.joinFee()]);
      cost = ethers.formatEther(b + f) + " BOT · " + ethers.formatEther(b) + " refundable";
    } catch (e) { /* leave blank */ }
    v.innerHTML = '<div class="clay"><h2>Not a member yet</h2>' +
      '<p class="blurb">Post a refundable bond and pick a handle.</p>' +
      '<label for="f-handle">Your handle</label><input id="f-handle" maxlength="32" placeholder="rosa" />' +
      '<div style="margin-top:18px"><button class="mint" id="do-join">Join · ' + cost + "</button></div></div>";
    $("do-join").onclick = async () => {
      const handle = ($("f-handle").value || "").trim();
      if (!handle) { toast("Pick a handle.", true); return; }
      const [b, f] = await Promise.all([contract.joinBond(), contract.joinFee()]);
      send("Joining", () => contract.join(handle, { value: b + f }));
    };
    return;
  }

  const bal = Number(me.balanceMinutes);
  const span = Math.abs(Number(floor));
  const pct = Math.min(50, (Math.abs(bal) / span) * 50);
  v.innerHTML =
    '<div class="clay balance">' +
      '<div class="cap">' + esc(me.handle) + "</div>" +
      '<div class="num ' + (bal > 0 ? "plus" : bal < 0 ? "minus" : "") + '">' + hrs(bal) + "</div>" +
      '<div class="cap">' + (bal > 0 ? "owed to you" : bal < 0 ? "you owe" : "square") + "</div>" +
      '<div class="gauge">' +
        '<i class="' + (bal < 0 ? "owe" : "") + '" style="' +
          (bal < 0 ? "right:50%;width:" + pct + "%" : "left:50%;width:" + pct + "%") + '"></i>' +
        '<span class="mid"></span></div>' +
      '<p class="blurb" style="margin-top:16px">' + me.givenCount + " given · " + me.receivedCount +
        " received · room to receive " + hrs(Number(me.balanceMinutes) - Number(floor)) + "</p>" +
    "</div>" +
    '<div class="clay sm" style="margin-top:16px">' +
      '<p class="blurb" style="margin:0 0 10px">Bond ' + ethers.formatEther(me.bond) +
        " BOT · returned when you leave with a square balance.</p>" +
      '<button class="peach sm" id="do-leave">Leave &amp; reclaim bond</button></div>' +
    '<div class="clay sm tint" style="margin-top:16px">' +
      '<p class="blurb" style="margin:0">' + stats.members + " members · " + stats.entries +
        " entries · every balance on the loom adds up to zero.</p></div>";
  $("do-leave").onclick = () => send("Leaving", () => contract.leave());
}

function renderGive(v) {
  v.innerHTML =
    '<div class="clay"><h2>Log time you gave</h2>' +
      '<p class="blurb">They confirm it before any credit moves. You can never credit yourself.</p>' +
      '<label for="f-to">Their address</label><input id="f-to" placeholder="0x…" />' +
      '<label for="f-mins">How long</label><select id="f-mins">' +
        '<option value="15">15 minutes</option><option value="30">30 minutes</option>' +
        '<option value="60" selected>1 hour</option><option value="120">2 hours</option>' +
        '<option value="240">4 hours</option><option value="480">8 hours</option></select>' +
      '<label for="f-memo">What you did</label><input id="f-memo" maxlength="96" placeholder="rewired the shop lights" />' +
      '<div style="margin-top:18px"><button class="mint" id="do-log">Log it</button></div></div>' +
    '<div class="clay tint" style="margin-top:16px"><h2 style="font-size:19px">Ask for a hand</h2>' +
      '<label for="f-rmins">How long you need</label><select id="f-rmins">' +
        '<option value="30">30 minutes</option><option value="60" selected>1 hour</option>' +
        '<option value="120">2 hours</option><option value="240">4 hours</option></select>' +
      '<label for="f-rmemo">What you need</label><input id="f-rmemo" maxlength="96" placeholder="a hand moving a piano" />' +
      '<div style="margin-top:18px"><button class="lilac" id="do-ask">Post the ask</button></div></div>';

  $("do-log").onclick = () => {
    const to = ($("f-to").value || "").trim();
    const memo = ($("f-memo").value || "").trim();
    if (!ethers.isAddress(to)) { toast("That address is not valid.", true); return; }
    send("Logging the time", () => contract.logHours(to, $("f-mins").value, memo));
  };
  $("do-ask").onclick = () => {
    const memo = ($("f-rmemo").value || "").trim();
    if (!memo) { toast("Say what you need.", true); return; }
    send("Posting the ask", () => contract.postRequest($("f-rmins").value, memo));
  };
}

function renderBoard(v) {
  const open = requests.filter((x) => x.r.open);
  v.innerHTML = '<div class="section-title">Asks on the board</div>' +
    (open.length
      ? '<div class="list">' + open.map(({ id, r }) => {
          const mine = account && r.who.toLowerCase() === account.toLowerCase();
          return '<article class="clay sm entry">' +
            '<div class="chip ask">' + hrs(r.minutesWanted) + "</div>" +
            "<div><h4>" + esc(r.memo) + "</h4>" +
              '<div class="meta">' + short(r.who) + " · " + when(r.createdAt) + "</div></div>" +
            (mine ? '<div class="acts"><button class="sm" data-close="' + id + '">Close it</button></div>' : "") +
          "</article>";
        }).join("") + "</div>"
      : '<div class="clay empty">Nobody is asking for help right now.</div>');
}

function renderEntries(v, rows, isInbox) {
  v.innerHTML = '<div class="section-title">' + (isInbox ? "Waiting on you" : "The whole loom") + "</div>" +
    (rows.length
      ? '<div class="list">' + rows.map(({ id, e }) => {
          const status = Number(e.status);
          const mineIn = account && e.to.toLowerCase() === account.toLowerCase();
          const mineOut = account && e.from.toLowerCase() === account.toLowerCase();
          let acts = "";
          if (status === 0 && mineIn) {
            acts = '<button class="mint sm" data-confirm="' + id + '">Confirm</button>' +
                   '<button class="sm" data-decline="' + id + '">Decline</button>';
          } else if (status === 0 && mineOut) {
            acts = '<button class="sm" data-cancel="' + id + '">Withdraw it</button>';
          }
          return '<article class="clay sm entry">' +
            '<div class="chip ' + STATUS[status].toLowerCase() + '">' + hrs(e.minutesGiven) + "</div>" +
            "<div><h4>" + esc(e.memo || "time given") + "</h4>" +
              '<div class="meta">' + short(e.from) + " → " + short(e.to) + " · " + STATUS[status] +
              " · " + when(e.createdAt) + "</div></div>" +
            (acts ? '<div class="acts">' + acts + "</div>" : "") +
          "</article>";
        }).join("") + "</div>"
      : '<div class="clay empty">' + (isInbox ? "Nothing is waiting on you." : "No entries on the loom yet.") + "</div>");
}

/* --------------------------------------------------------------- actions */
async function send(label, fn) {
  if (!contract) { toast("Connect a wallet first.", true); return; }
  try {
    toast(label + "…");
    const tx = await fn();
    await tx.wait();
    toast(label + " confirmed");
    await load();
  } catch (e) { toast(reason(e), true); }
}

$("view").addEventListener("click", (ev) => {
  const c = ev.target.closest("button[data-confirm]");
  if (c) return send("Confirming", () => contract.confirmEntry(c.dataset.confirm));
  const d = ev.target.closest("button[data-decline]");
  if (d) return send("Declining", () => contract.declineEntry(d.dataset.decline));
  const x = ev.target.closest("button[data-cancel]");
  if (x) return send("Withdrawing the entry", () => contract.cancelEntry(x.dataset.cancel));
  const r = ev.target.closest("button[data-close]");
  if (r) return send("Closing the ask", () => contract.closeRequest(r.dataset.close));
});

document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    tab = b.dataset.tab;
    render();
  };
});

/* ------------------------------------------------------------------ boot */
$("p-net").textContent = NETWORK.chainName + " · " + NETWORK.label;
if (CONTRACT_ADDRESS !== ZERO) {
  $("p-ctr").textContent = short(CONTRACT_ADDRESS);
} else {
  $("p-ctr").textContent = "contract not set";
  $("p-ctr").className = "pill warn";
}
var walletBusy = false;
if (window.ethereum) {
  // Don't reload while we are mid-connect: switching the chain fires
  // chainChanged, and reloading there is what made Connect need two clicks.
  window.ethereum.on("accountsChanged", function () { if (!walletBusy) location.reload(); });
  window.ethereum.on("chainChanged", function () { if (!walletBusy) location.reload(); });
}
// Already authorised and on the right chain? Show connected without a click.
(async function reconnect() {
  if (!window.ethereum) return;
  try {
    const accs = await window.ethereum.request({ method: "eth_accounts" });
    if (!accs || !accs.length) return;
    const chain = await window.ethereum.request({ method: "eth_chainId" });
    if (String(chain).toLowerCase() !== NETWORK.chainId.toLowerCase()) return;
    await connect();
  } catch (e) { /* leave the Connect button as it was */ }
})();
readOnly();
load();

/* ---- BOT Chain ecosystem footer: follows the NETWORK config above ---- */
(function () {
  var ex = document.getElementById("bc-explorer");
  if (ex) ex.href = NETWORK.blockExplorerUrls[0];
})();
</script>
</body>
